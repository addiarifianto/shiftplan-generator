    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, className = "w-5 h-5", ...props }) => {
            const [svg, setSvg] = useState('');
            useEffect(() => {
                if (window.lucide) {
                    const iconNode = window.lucide.icons[name];
                    if (iconNode) {
                        const svgString = iconNode.map(item => {
                            const [tag, attrs] = item;
                            const attrStr = Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(' ');
                            return `<${tag} ${attrStr}></${tag}>`;
                        }).join('');
                        setSvg(svgString);
                    }
                }
            }, [name]);

            return (
                <svg 
                    className={className}
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    dangerouslySetInnerHTML={{ __html: svg }}
                    {...props}
                />
            );
        };

        const DEFAULT_EMPLOYEES = [
            { id: 'E1', name: 'Ahmad Fauzi', role: 'Full-Time', maxConsecutive: 5, prefShift: 'BOTH' },
            { id: 'E2', name: 'Budi Santoso', role: 'Full-Time', maxConsecutive: 5, prefShift: 'BOTH' },
            { id: 'E3', name: 'Citra Lestari', role: 'Full-Time', maxConsecutive: 4, prefShift: 'S1' },
            { id: 'E4', name: 'Dewi Anggraini', role: 'Part-Time', maxConsecutive: 3, prefShift: 'BOTH' },
            { id: 'E5', name: 'Eko Prasetyo', role: 'Full-Time', maxConsecutive: 5, prefShift: 'S2' },
            { id: 'E6', name: 'Fitri Handayani', role: 'Full-Time', maxConsecutive: 5, prefShift: 'BOTH' },
            { id: 'E7', name: 'Gilang Ramadhan', role: 'Part-Time', maxConsecutive: 3, prefShift: 'BOTH' },
            { id: 'E8', name: 'Hana Natalia', role: 'Full-Time', maxConsecutive: 5, prefShift: 'BOTH' }
        ];

        const SHIFTS = {
            S1: { id: 'S1', name: 'Pagi', label: 'P', start: '06:00', end: '18:00', color: 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100', isOff: false },
            S2: { id: 'S2', name: 'Malam', label: 'M', start: '18:00', end: '06:00', color: 'bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100', isOff: false },
            S1_FRI_SHORT: { id: 'S1_FRI_SHORT', name: 'P (12.00)', label: 'P (12.00)', start: '06:00', end: '12:00', color: 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100', isOff: false },
            S1_FRI_FULL: { id: 'S1_FRI_FULL', name: 'P (18.00)', label: 'P (18.00)', start: '06:00', end: '18:00', color: 'bg-teal-50 text-teal-700 border-teal-200 hover:bg-teal-100', isOff: false },
            OFF: { id: 'OFF', name: 'Libur', label: 'L', start: '-', end: '-', color: 'bg-slate-50 text-slate-400 border-slate-200 hover:bg-slate-100', isOff: true }
        };

        function App() {
            const [employees, setEmployees] = useState(() => {
                const saved = localStorage.getItem('gs_employees');
                return saved ? JSON.parse(saved) : DEFAULT_EMPLOYEES;
            });

            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
            const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth());
            
            // Mengatur sistem penyimpanan jadwal per-bulan
            const [allSchedules, setAllSchedules] = useState(() => {
                const saved = localStorage.getItem('gs_all_schedules');
                return saved ? JSON.parse(saved) : {};
            });

            const currentKey = `${selectedYear}_${selectedMonth}`;
            
            const schedule = useMemo(() => {
                return allSchedules[currentKey] || {};
            }, [allSchedules, currentKey]);

            const [allRequests, setAllRequests] = useState(() => {
                const saved = localStorage.getItem('gs_all_requests');
                return saved ? JSON.parse(saved) : {};
            });

            const currentRequests = useMemo(() => {
                return allRequests[currentKey] || {};
            }, [allRequests, currentKey]);

            const [activeTab, setActiveTab] = useState('schedule');
            const [isGenerating, setIsGenerating] = useState(false);
            const [generationProgress, setGenerationProgress] = useState(0);
            const [errorMsg, setErrorMsg] = useState('');
            const [successMsg, setSuccessMsg] = useState('');
            const [cellEditing, setCellEditing] = useState(null);
            const [employeeToDelete, setEmployeeToDelete] = useState(null);

            // Form states untuk tambah/edit karyawan
            const [newEmpName, setNewEmpName] = useState('');
            const [newEmpRole, setNewEmpRole] = useState('Full-Time');
            const [newEmpPref, setNewEmpPref] = useState('BOTH');
            const [newEmpMaxDays, setNewEmpMaxDays] = useState(5);
            const [editingEmpId, setEditingEmpId] = useState(null);

            // Firebase Auth state
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [firestoreReady, setFirestoreReady] = useState(false);
            const syncTimerRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('gs_employees', JSON.stringify(employees));
            }, [employees]);

            useEffect(() => {
                localStorage.setItem('gs_all_schedules', JSON.stringify(allSchedules));
            }, [allSchedules]);

            useEffect(() => {
                localStorage.setItem('gs_all_requests', JSON.stringify(allRequests));
            }, [allRequests]);

            // Listen Firebase auth state changes - shared workspace
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (firebaseUser) => {
                    if (firebaseUser) {
                        setUser(firebaseUser);
                        try {
                            const docRef = db.collection('global').doc('data');
                            const docSnap = await docRef.get();
                            if (docSnap.exists) {
                                const data = docSnap.data();
                                if (data.employees && Array.isArray(data.employees)) setEmployees(data.employees);
                                if (data.allSchedules) setAllSchedules(data.allSchedules);
                                if (data.allRequests) setAllRequests(data.allRequests);
                            }
                        } catch (e) {
                            console.error('Firestore load error:', e);
                        }
                        setFirestoreReady(true);
                    } else {
                        setUser(null);
                        setFirestoreReady(false);
                    }
                    setAuthLoading(false);
                });
                return unsubscribe;
            }, []);

            // Debounced sync to shared Firestore doc
            useEffect(() => {
                if (!user || !firestoreReady) return;
                if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
                syncTimerRef.current = setTimeout(async () => {
                    try {
                        await db.collection('global').doc('data').set({
                            employees: employees,
                            allSchedules: allSchedules,
                            allRequests: allRequests,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    } catch (e) {
                        console.error('Firestore sync error:', e);
                    }
                }, 1000);
                return () => {
                    if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
                };
            }, [employees, allSchedules, allRequests, user, firestoreReady]);

            const handleLogin = async () => {
                try {
                    await auth.signInWithPopup(googleProvider);
                } catch (e) {
                    if (e.code !== 'auth/popup-closed-by-user') {
                        console.error('Login error:', e);
                    }
                }
            };

            const handleLogout = async () => {
                try {
                    await auth.signOut();
                } catch (e) {
                    console.error('Logout error:', e);
                }
            };

            const daysInMonth = useMemo(() => {
                return new Date(selectedYear, selectedMonth + 1, 0).getDate();
            }, [selectedYear, selectedMonth]);

            const daysArray = useMemo(() => {
                const arr = [];
                for (let i = 1; i <= daysInMonth; i++) {
                    const date = new Date(selectedYear, selectedMonth, i);
                    arr.push({ dayNum: i, dayOfWeek: date.getDay() });
                }
                return arr;
            }, [daysInMonth, selectedYear, selectedMonth]);

            const getDayName = (dayOfWeek) => {
                return ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][dayOfWeek];
            };

            const getMonthName = (monthIndex) => {
                return [
                    'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 
                    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
                ][monthIndex];
            };

            // Fase 3: perata hari kerja/libur — memindahkan 1 hari kerja dari
            // karyawan bertotal tinggi ke bertotal rendah tanpa melanggar constraint.
            const repairBalancedOff = (sched, days, requests) => {
                const work = {};
                const isPagiS = (s) => s === 'S1' || s === 'S1_FRI_SHORT' || s === 'S1_FRI_FULL';
                employees.forEach(e => {
                    work[e.id] = 0;
                    for (let d = 1; d <= days; d++) {
                        const s = sched[e.id][d];
                        if (s && s !== 'OFF') work[e.id]++;
                    }
                });
                const workAt = (id, d) => { const s = sched[id][d]; return s && s !== 'OFF'; };
                const streakEnd = (id, d) => { let c = 0; for (let k = d; k >= 1; k--) { if (workAt(id, k)) c++; else break; } return c; };
                const streakStart = (id, d) => { let c = 0; for (let k = d; k <= days; k++) { if (workAt(id, k)) c++; else break; } return c; };
                const eligible = (id, d, sh) => {
                    const emp = employees.find(x => x.id === id);
                    const mx = emp.maxConsecutive || 5;
                    if (isPagiS(sh)) {
                        if (sched[id][d - 1] === 'S2') return false;
                        if (emp.prefShift === 'S2') return false;
                        if (streakEnd(id, d - 1) + 1 + streakStart(id, d + 1) > mx) return false;
                    } else {
                        if (emp.prefShift === 'S1') return false;
                        if (isPagiS(sched[id][d + 1])) return false;
                        if (streakEnd(id, d - 1) + 1 + streakStart(id, d + 1) > mx) return false;
                    }
                    return true;
                };

                let improved = true;
                let guard = 0;
                while (improved && guard++ < 500) {
                    improved = false;
                    const donors = [...employees].sort((a, b) => work[b.id] - work[a.id]);
                    for (const di of donors) {
                        if (improved) break;
                        for (const ri of [...donors].reverse()) {
                            if (improved) break;
                            if (di.id === ri.id) continue;
                            if (work[di.id] - work[ri.id] <= 1) continue;
                            for (let d = 1; d <= days; d++) {
                                const sh = sched[di.id][d];
                                if (!sh || sh === 'OFF') continue;
                                if (requests && (requests[di.id]?.[d] || requests[ri.id]?.[d])) continue;
                                if (workAt(ri.id, d)) continue;
                                if (!eligible(ri.id, d, sh)) continue;
                                // Pengaman "tanpa 2 libur beruntun": donor akan OFF di hari d,
                                // tolak bila membuat 2 hari OFF beruntun bagi donor.
                                if (sched[di.id][d - 1] === 'OFF' || sched[di.id][d + 1] === 'OFF') continue;
                                sched[ri.id][d] = sh;
                                sched[di.id][d] = 'OFF';
                                work[ri.id]++;
                                work[di.id]--;
                                improved = true;
                                break;
                            }
                        }
                    }
                }
            };

            // Fase 5: jaminan cakupan harian — pindahkan 1 hari kerja sejenis (pagi/malam)
            // dari hari lain ke hari yang masih kekurangan personil, tanpa melanggar constraint.
            // Hanya diambil dari hari yang tetap surplus, sehingga cakupan hari lain tidak menurun.
            const coverShortages = (sched, days, requests, year, month) => {
                const isPagiS = (s) => s === 'S1' || s === 'S1_FRI_SHORT' || s === 'S1_FRI_FULL';
                const targetAt = (d) => {
                    const dow = new Date(year, month, d).getDay();
                    return { tm: (dow === 0 || dow === 6) ? 1 : 2, tn: 2 };
                };
                const countAt = (d) => {
                    let mc = 0, nc = 0;
                    employees.forEach(e => {
                        const sh = sched[e.id]?.[d];
                        if (isPagiS(sh)) mc++;
                        else if (sh === 'S2') nc++;
                    });
                    return { mc, nc };
                };
                const workAt = (id, d) => { const s = sched[id]?.[d]; return s && s !== 'OFF'; };
                const streakEnd = (id, d) => { let c = 0; for (let k = d; k >= 1; k--) { if (workAt(id, k)) c++; else break; } return c; };
                const streakStart = (id, d) => { let c = 0; for (let k = d; k <= days; k++) { if (workAt(id, k)) c++; else break; } return c; };

                const placeBlk = (id, d, sh) => {
                    const emp = employees.find((x) => x.id === id);
                    if (!emp) return 'empNotFound';
                    const mx = emp.maxConsecutive || 5;
                    if (streakEnd(id, d - 1) + 1 + streakStart(id, d + 1) > mx) return 'maxConsecutive';
                    if (isPagiS(sh)) {
                        if (sched[id]?.[d - 1] === 'S2') return 'malamSebelum';
                        if (emp.prefShift === 'S2') return 'prefMalam';
                    } else {
                        if (emp.prefShift === 'S1') return 'prefPagi';
                        if (isPagiS(sched[id]?.[d + 1])) return 'pagiSesudah';
                    }
                    return null;
                };

                const tryMove = () => {
                    for (let d = 1; d <= days; d++) {
                        const { tm, tn } = targetAt(d);
                        const c = countAt(d);
                        const needM = Math.max(0, tm - c.mc);
                        const needN = Math.max(0, tn - c.nc);
                        if (!needM && !needN) continue;
                        for (const emp of employees) {
                            if (requests && requests[emp.id]?.[d]) continue;
                            if (workAt(emp.id, d)) continue;
                            const moveTo = (src, dstSh) => { sched[emp.id][d] = dstSh; sched[emp.id][src] = 'OFF'; };
                            // (a) penempatan langsung ke slot yang kurang
                            for (const sh of (needM && needN ? ['S1', 'S2'] : [needM ? 'S1' : 'S2'])) {
                                if (!placeBlk(emp.id, d, sh)) { sched[emp.id][d] = sh; return true; }
                            }
                            // (c) tukar silang: sesama hari d, istirahatkan shift jenis lain agar jenis kurang terisi
                            if (needM) {
                                for (let s = 1; s <= days; s++) {
                                    if (s === d || sched[emp.id]?.[s] !== 'S2') continue;
                                    if (countAt(s).nc - 1 < targetAt(s).tn) continue;
                                    if (requests && requests[emp.id]?.[s]) continue;
                                    if (placeBlk(emp.id, d, 'S1')) continue;
                                    moveTo(s, 'S1'); return true;
                                }
                            }
                            if (needN) {
                                for (let s = 1; s <= days; s++) {
                                    if (s === d || !isPagiS(sched[emp.id]?.[s])) continue;
                                    if (countAt(s).mc - 1 < targetAt(s).tm) continue;
                                    if (requests && requests[emp.id]?.[s]) continue;
                                    if (placeBlk(emp.id, d, 'S2')) continue;
                                    moveTo(s, 'S2'); return true;
                                }
                            }
                            // (b) donor sejenis dari hari surplus
                            if (needM) {
                                for (let s = 1; s <= days; s++) {
                                    if (s === d || !isPagiS(sched[emp.id]?.[s])) continue;
                                    if (countAt(s).mc - 1 < targetAt(s).tm) continue;
                                    if (requests && requests[emp.id]?.[s]) continue;
                                    if (placeBlk(emp.id, d, 'S1')) continue;
                                    moveTo(s, 'S1'); return true;
                                }
                            }
                            if (needN) {
                                for (let s = 1; s <= days; s++) {
                                    if (s === d || sched[emp.id]?.[s] !== 'S2') continue;
                                    if (countAt(s).nc - 1 < targetAt(s).tn) continue;
                                    if (requests && requests[emp.id]?.[s]) continue;
                                    if (placeBlk(emp.id, d, 'S2')) continue;
                                    moveTo(s, 'S2'); return true;
                                }
                            }
                            // (e) lepas hari terawal dari peruntukan beruntun terakhir, biarkan iterasi berikutnya menutupnya
                            if (needM) {
                                const run = [];
                                for (let k = d - 1; k >= 1; k--) { if (workAt(emp.id, k)) run.push(k); else break; }
                                for (let i = 0; i < run.length && i < (emp.maxConsecutive || 5); i++) {
                                    const w = run[i];
                                    if (requests && requests[emp.id]?.[w]) continue;
                                    if (isPagiS(sched[emp.id][w])) {
                                        if (countAt(w).mc - 1 < targetAt(w).tm) continue;
                                        sched[emp.id][d] = 'S1'; sched[emp.id][w] = 'OFF'; return true;
                                    }
                                }
                            }
                            if (needN) {
                                const run = [];
                                for (let k = d - 1; k >= 1; k--) { if (workAt(emp.id, k)) run.push(k); else break; }
                                for (let i = 0; i < run.length && i < (emp.maxConsecutive || 5); i++) {
                                    const w = run[i];
                                    if (requests && requests[emp.id]?.[w]) continue;
                                    if (sched[emp.id][w] === 'S2') {
                                        if (countAt(w).nc - 1 < targetAt(w).tn) continue;
                                        sched[emp.id][d] = 'S2'; sched[emp.id][w] = 'OFF'; return true;
                                    }
                                }
                            }
                        }
                    }
                    return false;
                };

                let guard = 0;
                while (tryMove() && guard++ < 500) {}
            };

            // === Penyelesai Eksak Bulan Penuh (Exact Cover, bias-seimbang) ===
            // Jika masih ada hari bercakupan kurang setelah semua perbaikan lokal, seluruh bulan
            // disusun ulang secara legal (request/preferensi dihormati). Bila terbukti mustahil,
            // jadwal dikembalikan seperti semula & gap dilaporkan jujur — tanpa pelonggaran manual.
            const fullSolveExact = (sched, days, requests, year, month) => {
                const isPagiF = (sh) => sh === 'S1' || sh === 'S1_FRI_SHORT' || sh === 'S1_FRI_FULL';
                const targetAt = (y, mo, d) => {
                    const dow = new Date(y, mo, d).getDay();
                    return { tm: (dow === 0 || dow === 6) ? 1 : 2, tn: 2 };
                };
                const workAt = (id, d) => sched[id]?.[d] && sched[id][d] !== 'OFF';
                const streakEnd = (id, d) => { let c = 0; for (let k = d; k >= 1; k--) { if (workAt(id, k)) c++; else break; } return c; };
                const streakStart = (id, d) => { let c = 0; for (let k = d; k <= days; k++) { if (workAt(id, k)) c++; else break; } return c; };
                employees.forEach(e => { if (!sched[e.id]) sched[e.id] = {}; for (let d = 1; d <= days; d++) if (!sched[e.id][d]) sched[e.id][d] = 'OFF'; });
                const blockOfFull = (emp, d, sh) => {
                    const mx = emp.maxConsecutive || 5;
                    if (isPagiF(sh)) {
                        if (sched[emp.id]?.[d - 1] === 'S2') return 'malamSebelum';
                        if (emp.prefShift === 'S2') return 'prefS2';
                        if (streakEnd(emp.id, d - 1) + 1 + streakStart(emp.id, d + 1) > mx) return 'maxConsecutive';
                    } else {
                        if (emp.prefShift === 'S1') return 'prefS1';
                        if (isPagiF(sched[emp.id]?.[d + 1])) return 'pagiSesudah';
                        if (streakEnd(emp.id, d - 1) + 1 + streakStart(emp.id, d + 1) > mx) return 'maxConsecutive';
                    }
                    return null;
                };
                const comboPart = (dd) => {
                    const { tm, tn } = targetAt(year, month, dd);
                    const can = [];
                    const pm1 = (emm, d) => { if (sched[emm.id]?.[d - 1] === 'S2') return false; if (emm.prefShift === 'S2') return false; return (streakEnd(emm.id, d - 1) + 1 <= (emm.maxConsecutive || 5)); };
                    const pm2 = (emm, d) => { if (emm.prefShift === 'S1') return false; return (streakEnd(emm.id, d - 1) + 1 <= (emm.maxConsecutive || 5)); };
                    employees.forEach((e) => {
                        const req = requests && requests[e.id] && requests[e.id][dd];
                        if (req === 'OFF') return;
                        if (req === 'S1') { can.push({ id: e.id, S1ok: pm1(e, dd), S2ok: false }); return; }
                        if (req === 'S2') { can.push({ id: e.id, S1ok: false, S2ok: pm2(e, dd) }); return; }
                        can.push({ id: e.id, S1ok: pm1(e, dd), S2ok: pm2(e, dd) });
                    });
                    if (can.length < tm + tn) return [];
                    // Aturan "tanpa 2 libur beruntun": siapa pun yang libur kemarin WAJIB dinas hari
                    // ini — kecuali meminta libur hari ini sendiri (liburan yang diminta tetap dihormati).
                    const must = [];
                    employees.forEach(e => {
                        const req = requests && requests[e.id] && requests[e.id][dd];
                        if (req === 'OFF') return;
                        if (dd > 1 && sched[e.id]?.[dd - 1] === 'OFF') must.push(e.id);
                    });
                    const out = [];
                    const rec2 = (j, pi, ni) => {
                        if (pi.length === tm && ni.length === tn) { const w = pi.slice().concat(ni.slice()); if (must.every(id => w.includes(id))) out.push(w); return; }
                        if (pi.length + ni.length >= can.length || pi.length + ni.length > tm + tn) return;
                        for (let i = j; i < can.length; i++) {
                            const c = can[i];
                            if (pi.length < tm && c.S1ok) { pi.push(c.id); rec2(i + 1, pi, ni); pi.pop(); }
                            if (ni.length < tn && c.S2ok) { ni.push(c.id); rec2(i + 1, pi, ni); ni.pop(); }
                        }
                    };
                    rec2(0, [], []);
                    return out;
                };
                const verifyDay = (dd) => {
                    const { tm, tn } = targetAt(year, month, dd);
                    let mc = 0, nc = 0;
                    for (const e of employees) {
                        const sh = sched[e.id]?.[dd];
                        if (isPagiF(sh)) { if (blockOfFull(e, dd, sh)) return false; mc++; }
                        else if (sh === 'S2') { if (blockOfFull(e, dd, sh)) return false; nc++; }
                    }
                    return mc >= tm && nc >= tn;
                };
                let nodes = 0;
                let exhausted = false;
                const orig = {};
                employees.forEach(e => { orig[e.id] = {}; for (let d = 1; d <= days; d++) orig[e.id][d] = sched[e.id][d]; });
                const pmc = {};
                employees.forEach(e => pmc[e.id] = { p: 0, n: 0 });
                const empById = {};
                employees.forEach(e => empById[e.id] = e);
                const nodeBudget = 8000000;
                const rec = (dd) => {
                    if (++nodes > nodeBudget) { exhausted = true; return false; }
                    if (dd > days) return true;
                    const cs = comboPart(dd);
                    const old = {};
                    employees.forEach(e => old[e.id] = sched[e.id][dd]);
                    const { tm } = targetAt(year, month, dd);
                    // Urutkan combo dengan tujuan yang SAMA dengan greedy (total hari kerja,
                    // balance pagi/malam, preferensi, request) agar hasil eksak tidak meratakan
                    // malam merata ke semua orang — menarik pegawai bertotal-rendah (mis. khusus
                    // malam) lebih dulu, self-limiting saat totalnya mendekati rata-rata.
                    cs.sort((a, b) => {
                        const costOf = (combo) => {
                            let s = 0;
                            for (let i = 0; i < combo.length; i++) {
                                const addP = i < tm;
                                const id = combo[i];
                                const emp = empById[id];
                                const prev = pmc[id];
                                const tp = prev.p + (addP ? 1 : 0);
                                const tn = prev.n + (addP ? 0 : 1);
                                const bal = emp.prefShift === 'BOTH' ? 2 * (addP ? (tp - tn) : (tn - tp)) : 0;
                                const prq = requests && requests[id] && requests[id][dd];
                                const aReq = !prq ? 0 : (addP ? (prq === 'S1' ? -10 : 0) : (prq === 'S2' ? -10 : 0));
                                const aNextS1 = (!addP && requests && requests[id] && requests[id][dd + 1] === 'S1') ? 10 : 0;
                                const aPref = addP ? (emp.prefShift === 'S1' || emp.prefShift === 'BOTH' ? -2 : 0) : (emp.prefShift === 'S2' || emp.prefShift === 'BOTH' ? -2 : 0);
                                const aPrevOff = dd > 1 && sched[id] && sched[id][dd - 1] === 'OFF' ? -3 : 0;
                                s += (tp + tn) + bal + aPref + aReq + aNextS1 + aPrevOff;
                            }
                            return s;
                        };
                        return costOf(a) - costOf(b);
                    });
                    for (const combo of cs) {
                        employees.forEach(e => sched[e.id][dd] = 'OFF');
                        for (let i = 0; i < combo.length; i++) { const addP = i < tm; sched[combo[i]][dd] = addP ? 'S1' : 'S2'; pmc[combo[i]][addP ? 'p' : 'n']++; }
                        if (rec(dd + 1) && verifyDay(dd)) return true;
                        for (let i = 0; i < combo.length; i++) { const addP = i < tm; pmc[combo[i]][addP ? 'p' : 'n']--; }
                        employees.forEach(e => sched[e.id][dd] = old[e.id]);
                    }
                    return false;
                };
                const ok = rec(1);
                if (!ok) employees.forEach(e => { sched[e.id] = {}; for (let d = 1; d <= days; d++) sched[e.id][d] = orig[e.id][d]; });
                return ok;
            };

            // Penyeimbang akhir: tukar pagi<->malam antar dua personil BOTH di hari yang sama
            // bila legal & memperkecil selisih |pagi - malam| masing-masing (cakupan tetap penuh).
            const rebalancePM = (sched, days, requests) => {
                const isPagiR = (sh) => sh === 'S1' || sh === 'S1_FRI_SHORT' || sh === 'S1_FRI_FULL';
                const workAt = (id, d) => sched[id]?.[d] && sched[id][d] !== 'OFF';
                const streakEnd = (id, d) => { let c = 0; for (let k = d; k >= 1; k--) { if (workAt(id, k)) c++; else break; } return c; };
                const streakStart = (id, d) => { let c = 0; for (let k = d; k <= days; k++) { if (workAt(id, k)) c++; else break; } return c; };
                const reqAt = (id, d) => !!(requests && requests[id] && requests[id][d]);
                const blockOf = (emp, d, sh) => {
                    const mx = emp.maxConsecutive || 5;
                    if (isPagiR(sh)) {
                        if (sched[emp.id]?.[d - 1] === 'S2') return 'malamSebelum';
                        if (emp.prefShift === 'S2') return 'prefS2';
                        if (streakEnd(emp.id, d - 1) + 1 + streakStart(emp.id, d + 1) > mx) return 'maxConsecutive';
                    } else {
                        if (emp.prefShift === 'S1') return 'prefS1';
                        if (isPagiR(sched[emp.id]?.[d + 1])) return 'pagiSesudah';
                        if (streakEnd(emp.id, d - 1) + 1 + streakStart(emp.id, d + 1) > mx) return 'maxConsecutive';
                    }
                    return null;
                };
                const pm = (id) => { let p = 0, n = 0; for (let d = 1; d <= days; d++) { const s = sched[id][d]; if (isPagiR(s)) p++; else if (s === 'S2') n++; } return { p, n }; };
                let guard = 0;
                while (guard++ < 1000) {
                    let improved = false;
                    const B = employees.filter(e => e.prefShift === 'BOTH');
                    for (const A of B) {
                        if (improved) break;
                        for (const C of B) {
                            if (improved || A === C) continue;
                            const a = pm(A.id), c = pm(C.id);
                            const cur = Math.abs(a.p - a.n) + Math.abs(c.p - c.n);
                            for (let d = 1; d <= days && !improved; d++) {
                                const sa = sched[A.id]?.[d], sc = sched[C.id]?.[d];
                                const isAp = isPagiR(sa), isCn = (sc === 'S2');
                                if (!(isAp && isCn)) continue;
                                if (reqAt(A.id, d) && requests[A.id][d] === 'S1') continue;
                                if (reqAt(C.id, d) && requests[C.id][d] === 'S2') continue;
                                if (blockOf(A, d, 'S2')) continue;
                                if (blockOf(C, d, 'S1')) continue;
                                const a2 = { p: a.p - 1, n: a.n + 1 }, c2 = { p: c.p + 1, n: c.n - 1 };
                                const nxt = Math.abs(a2.p - a2.n) + Math.abs(c2.p - c2.n);
                                if (nxt >= cur) continue;
                                sched[A.id][d] = 'S2'; sched[C.id][d] = 'S1';
                                improved = true;
                            }
                        }
                    }
                    if (!improved) break;
                }
            };

            const generateSchedule = () => {
                if (employees.length === 0) {
                    setErrorMsg('Silakan tambahkan karyawan terlebih dahulu.');
                    return;
                }

                setIsGenerating(true);
                setGenerationProgress(10);

                setTimeout(() => {
                    try {
                        let newMonthlySchedule = {};
                        employees.forEach(emp => { newMonthlySchedule[emp.id] = {}; });

                        const workDaysCount = {};
                        const s1Prior = {};
                        const s2Prior = {};
                        const s1Cur = {};
                        const s2Cur = {};
                        const consecutiveDays = {};
                        const lastShift = {};

                        // Key bulan sebelumnya untuk riwayat (pembagian adil lintas bulan)
                        let prevMonth = selectedMonth === 0 ? 11 : selectedMonth - 1;
                        let prevYear = selectedMonth === 0 ? selectedYear - 1 : selectedYear;
                        let prevKey = `${prevYear}_${prevMonth}`;
                        let prevSchedule = allSchedules[prevKey] || {};
                        let prevDaysCount = new Date(prevYear, prevMonth + 1, 0).getDate();

                        // Fallback: jika arsip bulan sebelumnya tidak ada, pakai arsip terakhir yang tersedia
                        if (Object.keys(prevSchedule).length === 0) {
                            const curIdx = selectedYear * 12 + selectedMonth;
                            const candidates = Object.keys(allSchedules)
                                .filter(k => /^\d{4}_\d{1,2}$/.test(k))
                                .map(k => {
                                    const [yy, mm] = k.split('_').map(Number);
                                    const idx = yy * 12 + mm;
                                    return { k, idx };
                                })
                                .filter(c => c.idx < curIdx && Object.keys(allSchedules[c.k] || {}).length > 0)
                                .sort((a, b) => b.idx - a.idx);
                            if (candidates.length > 0 && candidates[0].k !== prevKey) {
                                prevKey = candidates[0].k;
                                prevSchedule = allSchedules[prevKey] || {};
                                const [yy, mm] = prevKey.split('_').map(Number);
                                prevYear = yy;
                                prevMonth = mm;
                                prevDaysCount = new Date(prevYear, prevMonth + 1, 0).getDate();
                            }
                        }

                        // Fase 4: memory rekan shift — pasangan yang sering bareng diberi penalti
                        // agar rekan 1 shift berganti-ganti (berputar) tanpa mengganggu keseimbangan.
                        const pairKey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
                        const pairCounts = {};
                        const bumpPair = (a, b) => {
                            if (!a || !b || a === b) return;
                            const k = pairKey(a, b);
                            pairCounts[k] = (pairCounts[k] || 0) + 1;
                        };
                        const isPagiShift = (s) => s === 'S1' || s === 'S1_FRI_SHORT' || s === 'S1_FRI_FULL';

                        // Seed dari seluruh arsip bulan SEBELUM bulan aktif (riwayat kebersamaan lintas bulan)
                        Object.keys(allSchedules).forEach(k => {
                            if (!/^\d{4}_\d{1,2}$/.test(k)) return;
                            const [yy, mm] = k.split('_').map(Number);
                            if (yy * 12 + mm >= selectedYear * 12 + selectedMonth) return;
                            const old = allSchedules[k] || {};
                            if (Object.keys(old).length === 0) return;
                            const od = new Date(yy, mm + 1, 0).getDate();
                            for (let pd = 1; pd <= od; pd++) {
                                const pagiIds = [];
                                const malamIds = [];
                                employees.forEach(e => {
                                    const sh = old[e.id]?.[pd];
                                    if (isPagiShift(sh)) pagiIds.push(e.id);
                                    else if (sh === 'S2') malamIds.push(e.id);
                                });
                                [pagiIds, malamIds].forEach(grp => {
                                    for (let x = 0; x < grp.length; x++) {
                                        for (let y = x + 1; y < grp.length; y++) bumpPair(grp[x], grp[y]);
                                    }
                                });
                            }
                        });

                        employees.forEach(emp => {
                            workDaysCount[emp.id] = 0;

                            let prevS1 = 0;
                            let prevS2 = 0;
                            let trailing = 0;
                            let lastSh = null;
                            const prevEmpSched = prevSchedule[emp.id];

                            if (prevEmpSched) {
                                for (let pd = 1; pd <= prevDaysCount; pd++) {
                                    const sh = prevEmpSched[pd];
                                    if (sh === 'S1' || sh === 'S1_FRI_SHORT' || sh === 'S1_FRI_FULL') prevS1++;
                                    else if (sh === 'S2') prevS2++;
                                }
                                lastSh = prevEmpSched[prevDaysCount] || null;
                                if (lastSh && lastSh !== 'OFF') {
                                    for (let pd = prevDaysCount; pd >= 1; pd--) {
                                        const sh = prevEmpSched[pd];
                                        if (sh && sh !== 'OFF') trailing++;
                                        else break;
                                    }
                                }
                            }

                            s1Prior[emp.id] = prevS1;
                            s2Prior[emp.id] = prevS2;
                            s1Cur[emp.id] = 0;
                            s2Cur[emp.id] = 0;
                            consecutiveDays[emp.id] = trailing;
                            lastShift[emp.id] = lastSh;
                        });

for (let d = 1; d <= daysInMonth; d++) {
                            const date = new Date(selectedYear, selectedMonth, d);
                            const dayOfWeek = date.getDay();
                            const isFriday = dayOfWeek === 5;
                            const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;

                            let dailyPool = [...employees];
                            const assignedToday = new Set();

                            // 0. Pre-assign OFF requests (libur yang diminta)
                            dailyPool.forEach(emp => {
                                const req = currentRequests[emp.id]?.[d];
                                if (req === 'OFF') {
                                    newMonthlySchedule[emp.id][d] = 'OFF';
                                    assignedToday.add(emp.id);
                                    consecutiveDays[emp.id] = 0;
                                    lastShift[emp.id] = 'OFF';
                                }
                            });

                            // 1. Aturan Shift Pagi & 2. Shift Malam (2 personil/shift, pasangan berputar)
                            let morningQuota = isWeekend ? 1 : 2;
                            let assignedMorning = 0;
                            let assignedNight = 0;

                            // Fase 4: pilih personil dua-tahap — slot pertama (skor prior+balance terendah),
                            // slot kedua/rekan = skor + penalti riwayat kebersamaan agar pasangan berputar.
                            const tryAssignShift = (shiftId, quota) => {
                                const isPagi = isPagiShift(shiftId);
                                let assigned = 0;
                                while (assigned < quota) {
                                    let partnerId = null;
                                    employees.forEach(e => {
                                        if (partnerId || !assignedToday.has(e.id)) return;
                                        const es = newMonthlySchedule[e.id]?.[d];
                                        if (isPagi ? isPagiShift(es) : es === 'S2') partnerId = e.id;
                                    });
                                    let best = null;
                                    let bestScore = Infinity;
                                    dailyPool.forEach(emp => {
                                        if (assignedToday.has(emp.id)) return;
                                        if ((emp.maxConsecutive || 5) <= consecutiveDays[emp.id]) return;
                                        if (isPagi) {
                                            if (lastShift[emp.id] === 'S2') return;
                                            if (emp.prefShift === 'S2' && currentRequests[emp.id]?.[d] !== 'S1') return;
                                            if (currentRequests[emp.id]?.[d] === 'S2') return;
                                        } else {
                                            if (emp.prefShift === 'S1' && currentRequests[emp.id]?.[d] !== 'S2') return;
                                            if (currentRequests[emp.id]?.[d + 1] === 'S1') return;
                                            if (currentRequests[emp.id]?.[d] === 'S1') return;
                                        }
                                        let sc;
                                        const aPrevOff = lastShift[emp.id] === 'OFF' ? -3 : 0;
                                        const aTotal = (s1Prior[emp.id] + s1Cur[emp.id]) + (s2Prior[emp.id] + s2Cur[emp.id]);
                                        if (isPagi) {
                                            const aReq = currentRequests[emp.id]?.[d] === 'S1' ? -10 : 0;
                                            const aPref = emp.prefShift === 'S1' || emp.prefShift === 'BOTH' ? -2 : 0;
                                            const aBal = emp.prefShift === 'BOTH' ? 2 * (s1Cur[emp.id] - s2Cur[emp.id]) : 0;
                                            sc = aTotal + aBal + aPref + aReq + aPrevOff;
                                        } else {
                                            const aReq = currentRequests[emp.id]?.[d] === 'S2' ? -10 : 0;
                                            const aNextS1 = currentRequests[emp.id]?.[d + 1] === 'S1' ? 10 : 0;
                                            const aPref = emp.prefShift === 'S2' || emp.prefShift === 'BOTH' ? -2 : 0;
                                            const aBal = emp.prefShift === 'BOTH' ? 2 * (s2Cur[emp.id] - s1Cur[emp.id]) : 0;
                                            sc = aTotal + aBal + aPref + aReq + aNextS1 + aPrevOff;
                                        }
                                        if (partnerId) sc += Math.min(pairCounts[pairKey(emp.id, partnerId)] || 0, 4);
                                        if (sc < bestScore) { bestScore = sc; best = emp; }
                                    });
                                    if (!best) break;
                                    newMonthlySchedule[best.id][d] = shiftId;
                                    assignedToday.add(best.id);
                                    workDaysCount[best.id]++;
                                    if (isPagi) s1Cur[best.id]++; else s2Cur[best.id]++;
                                    consecutiveDays[best.id]++;
                                    lastShift[best.id] = shiftId;
                                    if (partnerId) bumpPair(best.id, partnerId);
                                    if (isPagi) assignedMorning++; else assignedNight++;
                                    assigned++;
                                }
                            };

                            if (isFriday) {
                                const fridayShifts = ['S1_FRI_SHORT', 'S1_FRI_FULL'];
                                fridayShifts.forEach(fShiftId => { tryAssignShift(fShiftId, 1); });
                            } else {
                                tryAssignShift('S1', Math.max(0, morningQuota));
                            }

                            // 2. Aturan Shift Malam (Tetap 2 Personil)
                            const nightQuota = 2;
                            tryAssignShift('S2', Math.max(0, nightQuota));

                            // 3. Menugaskan Libur (L)
                            employees.forEach(emp => {
                                if (!assignedToday.has(emp.id)) {
                                    newMonthlySchedule[emp.id][d] = 'OFF';
                                    consecutiveDays[emp.id] = 0;
                                    lastShift[emp.id] = 'OFF';
                                }
                            });

                            setGenerationProgress(Math.floor(10 + (d / daysInMonth) * 80));
                        }

                        // Fase 5: tutup kekurangan cakupan harian (pagi/malam) — beberapa lintasan
                        // cover (hanya perpindahan yang patuh aturan) diselingi perata akhir agar
                        // setiap relokasi membuka relokasi sah berikutnya.
                        for (let pass = 0; pass < 3; pass++) {
                            coverShortages(newMonthlySchedule, daysInMonth, currentRequests, selectedYear, selectedMonth);
                            repairBalancedOff(newMonthlySchedule, daysInMonth, currentRequests);
                        }

                        // Cek akhir: hari yang masih kurang personil (pagi/malam) setelah semua
                        // perbaikan lokal. Bila masih ada, susun ulang bulan penuh secara eksak
                        // (jaminan legal + cakupan 100%). Bila terbukti mustahil, jadwal dibiarkan
                        // apa adanya dan gap dilaporkan jujur di panel — tidak ada pelonggaran manual.
                        const isPagiG = (sh) => sh === 'S1' || sh === 'S1_FRI_SHORT' || sh === 'S1_FRI_FULL';
                        const gapDays = [];
                        for (let gd = 1; gd <= daysInMonth; gd++) {
                            const gDow = new Date(selectedYear, selectedMonth, gd).getDay();
                            const gT = { tm: (gDow === 0 || gDow === 6) ? 1 : 2, tn: 2 };
                            let mc = 0, nc = 0;
                            employees.forEach(e => {
                                const sh = newMonthlySchedule[e.id]?.[gd];
                                if (isPagiG(sh)) mc++;
                                else if (sh === 'S2') nc++;
                            });
                            if (mc < gT.tm || nc < gT.tn) gapDays.push(gd);
                        }
                        // Aturan "tanpa 2 hari libur beruntun": cari klaster libur (panjang >= 2)
                        // yang bukan murni permintaan libur user (liburan yang diminta tetap dihormati).
                        const offRuns2 = [];
                        employees.forEach(emp => {
                            let runStart = 0;
                            for (let gd = 1; gd <= daysInMonth; gd++) {
                                const sh = newMonthlySchedule[emp.id]?.[gd];
                                const isOff = !sh || sh === 'OFF';
                                if (isOff) { if (!runStart) runStart = gd; }
                                else {
                                    if (runStart && gd - runStart >= 2) {
                                        let anyReq = false;
                                        for (let k = runStart; k < gd; k++) if (currentRequests[emp.id]?.[k] === 'OFF') { anyReq = true; break; }
                                        if (!anyReq) offRuns2.push({ empId: emp.id, start: runStart, len: gd - runStart });
                                    }
                                    runStart = 0;
                                }
                            }
                            if (runStart && daysInMonth - runStart + 1 >= 2) {
                                let anyReq = false;
                                for (let k = runStart; k <= daysInMonth; k++) if (currentRequests[emp.id]?.[k] === 'OFF') { anyReq = true; break; }
                                if (!anyReq) offRuns2.push({ empId: emp.id, start: runStart, len: daysInMonth - runStart + 1 });
                            }
                        });
                        if (gapDays.length || offRuns2.length) {
                            fullSolveExact(newMonthlySchedule, daysInMonth, currentRequests, selectedYear, selectedMonth);
                        }
                        rebalancePM(newMonthlySchedule, daysInMonth, currentRequests);
                        // Perata total hari kerja terakhir: hasil solver (bila dipicu) maupun
                        // rebalancePM tidak meratakan jumlah libur/hari kerja antar pegawai
                        // (terutama yang khusus malam), jadi jalankan sekali lagi di akhir.
                        repairBalancedOff(newMonthlySchedule, daysInMonth, currentRequests);

                        setAllSchedules(prev => ({
                            ...prev,
                            [currentKey]: newMonthlySchedule
                        }));
                        
                        setGenerationProgress(100);
                        setTimeout(() => {
                            setIsGenerating(false);
                            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                            showSuccessNotification('Sukses generate jadwal baru secara otomatis!');
                        }, 400);

                    } catch (err) {
                        setIsGenerating(false);
                        const detail = err && err.message ? err.message : String(err);
                        console.error('Generate gagal:', err);
                        setErrorMsg('Gagal menghasilkan jadwal secara otomatis.' + (detail ? ` (${detail})` : ''));
                    }
                }, 600);
            };

            const handleCellClick = (empId, day) => {
                setCellEditing({ empId, day });
            };

            const selectManualShift = (shiftId) => {
                if (!cellEditing) return;
                const { empId, day } = cellEditing;

                setAllSchedules(prev => {
                    const currentSched = { ...(prev[currentKey] || {}) };
                    currentSched[empId] = {
                        ...(currentSched[empId] || {}),
                        [day]: shiftId
                    };
                    return { ...prev, [currentKey]: currentSched };
                });
                setCellEditing(null);
                showSuccessNotification('Jadwal berhasil disesuaikan manual.');
            };

            const handleSetRequest = (shiftId) => {
                if (!cellEditing) return;
                const { empId, day } = cellEditing;

                setAllRequests(prev => {
                    const currentReq = { ...(prev[currentKey] || {}) };
                    if (shiftId === null) {
                        if (currentReq[empId]) {
                            const { [day]: _, ...rest } = currentReq[empId];
                            currentReq[empId] = Object.keys(rest).length ? rest : undefined;
                        }
                    } else {
                        currentReq[empId] = {
                            ...(currentReq[empId] || {}),
                            [day]: shiftId
                        };
                    }
                    return { ...prev, [currentKey]: currentReq };
                });
                setCellEditing(null);
                showSuccessNotification(
                    shiftId === null
                        ? 'Request berhasil dihapus.'
                        : `Request ${SHIFTS[shiftId]?.name || shiftId} tersimpan.`
                );
            };

            const showSuccessNotification = (msg) => {
                setSuccessMsg(msg);
                setTimeout(() => setSuccessMsg(''), 4000);
            };

            const securityCoverage = useMemo(() => {
                let shortageDaysCount = 0;
                let details = [];

                const streakEnd = (empId, d) => { let c = 0; for (let k = d; k >= 1; k--) { const s = schedule[empId]?.[k]; if (s && s !== 'OFF') c++; else break; } return c; };
                const streakStart = (empId, d) => { let c = 0; for (let k = d; k <= daysInMonth; k++) { const s = schedule[empId]?.[k]; if (s && s !== 'OFF') c++; else break; } return c; };
                const isPagiS = (s) => s === 'S1' || s === 'S1_FRI_SHORT' || s === 'S1_FRI_FULL';

                // Alasan spesifik mengapa kekurangan tidak dapat ditutup oleh personil yang
                // sedang libur (dipakai saat hari benar-benar mustahil legal terpenuhi).
                const blockedCauses = (d, needMorning, needNight) => {
                    const causes = [];
                    employees.forEach(emp => {
                        const sh = schedule[emp.id]?.[d];
                        if (sh && sh !== 'OFF') return;
                        if (currentRequests && currentRequests[emp.id]?.[d]) return;
                        const mx = emp.maxConsecutive || 5;
                        const over = streakEnd(emp.id, d - 1) + 1 + streakStart(emp.id, d + 1) > mx;
                        if (needMorning && emp.prefShift === 'S2') causes.push(`${emp.name} pref malam`);
                        else if (needMorning && schedule[emp.id]?.[d - 1] === 'S2') causes.push(`${emp.name} malam sebelumnya`);
                        else if (needMorning && over) causes.push(`${emp.name} maxConsecutive`);
                        if (needNight && emp.prefShift === 'S1') causes.push(`${emp.name} pref pagi`);
                        else if (needNight && isPagiS(schedule[emp.id]?.[d + 1])) causes.push(`${emp.name} besok pagi`);
                        else if (needNight && over) causes.push(`${emp.name} maxConsecutive`);
                    });
                    return causes;
                };

                for (let d = 1; d <= daysInMonth; d++) {
                    const date = new Date(selectedYear, selectedMonth, d);
                    const dayOfWeek = date.getDay();
                    const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;

                    // Hitung staf terdaftar untuk hari tersebut
                    let morningCount = 0;
                    let nightCount = 0;

                    employees.forEach(emp => {
                        const shiftId = schedule[emp.id]?.[d];
                        if (isPagiS(shiftId)) {
                            morningCount++;
                        }
                        if (shiftId === 'S2') {
                            nightCount++;
                        }
                    });

                    const targetMorning = isWeekend ? 1 : 2;
                    const targetNight = 2;

                    if (morningCount < targetMorning || nightCount < targetNight) {
                        shortageDaysCount++;
                        const needM = morningCount < targetMorning;
                        const needN = nightCount < targetNight;
                        const short = `Kekurangan: ${needM ? `Pagi (${morningCount}/${targetMorning})` : ''}${needM && needN ? ' & ' : ''}${needN ? `Malam (${nightCount}/${targetNight})` : ''}`;
                        const causes = blockedCauses(d, needM, needN);
                        const causeText = causes.length ? ` — tidak bisa ditutup oleh personil yang libur: ${causes.join(', ')}` : '';
                        details.push({ day: d, reason: short + causeText });
                    }
                }

                let violations = [];
                employees.forEach(emp => {
                    let streak = 0;
                    for (let d = 1; d <= daysInMonth; d++) {
                        const sh = schedule[emp.id]?.[d];
                        if (sh && sh !== 'OFF') {
                            streak++;
                            if (streak > (emp.maxConsecutive || 5)) violations.push(`d${d}/${emp.name}: kerja ${streak} hari berturut`);
                            if (sh === 'S2' && isPagiS(schedule[emp.id]?.[d + 1])) violations.push(`d${d}/${emp.name}: malam langsung pagi`);
                        } else {
                            streak = 0;
                        }
                    }
                });

                // Klaster libur beruntun (>= 2 hari) di luar yang diminta user — bahan laporan
                // jujur bila secara matematis tak bisa dihindari dengan jumlah personil saat ini.
                let offRuns2 = [];
                employees.forEach(emp => {
                    let runStart = 0;
                    for (let d = 1; d <= daysInMonth; d++) {
                        const sh = schedule[emp.id]?.[d];
                        const isOff = !sh || sh === 'OFF';
                        if (isOff) { if (!runStart) runStart = d; }
                        else {
                            if (runStart && d - runStart >= 2) {
                                let anyReq = false;
                                for (let k = runStart; k < d; k++) if (currentRequests[emp.id]?.[k] === 'OFF') { anyReq = true; break; }
                                if (!anyReq) offRuns2.push({ day: runStart, len: d - runStart, name: emp.name, empId: emp.id });
                            }
                            runStart = 0;
                        }
                    }
                    if (runStart && daysInMonth - runStart + 1 >= 2) {
                        let anyReq = false;
                        for (let k = runStart; k <= daysInMonth; k++) if (currentRequests[emp.id]?.[k] === 'OFF') { anyReq = true; break; }
                        if (!anyReq) offRuns2.push({ day: runStart, len: daysInMonth - runStart + 1, name: emp.name, empId: emp.id });
                    }
                });

                return { shortageDaysCount, details, violations, offRuns2 };
            }, [schedule, employees, daysInMonth, selectedMonth, selectedYear, currentRequests]);

            const getEmployeeStats = (empId) => {
                const stats = { S1: 0, S2: 0, S1_FRI_SHORT: 0, S1_FRI_FULL: 0, OFF: 0 };
                let totalHours = 0;
                let totalWorkDays = 0;

                const empSchedule = schedule[empId] || {};
                daysArray.forEach(d => {
                    const shiftId = empSchedule[d.dayNum];
                    if (shiftId && stats[shiftId] !== undefined) {
                        stats[shiftId]++;
                        if (shiftId === 'S1') { totalHours += 12; totalWorkDays++; }
                        else if (shiftId === 'S2') { totalHours += 12; totalWorkDays++; }
                        else if (shiftId === 'S1_FRI_SHORT') { totalHours += 6; totalWorkDays++; }
                        else if (shiftId === 'S1_FRI_FULL') { totalHours += 12; totalWorkDays++; }
                    }
                });

                return { stats, totalHours, totalWorkDays };

            const handleAddOrEditEmployee = (e) => {

            const exportToPDF = () => {

                const doc = new jsPDF('p', 'mm', 'a4');

                doc.setFont("Inter", "bold");

                doc.setFontSize(13);
                doc.text("Yayasan Ganesa Satria Temanggung", 105, 21, { align: 'center' });

                doc.setFont("Inter", "normal");

                doc.text(`Bulan: ${getMonthName(selectedMonth)} ${selectedYear}`, 105, 32, { align: 'center' });

                const tableHeaders = ['Tgl', 'Hari'];
                employees.forEach(emp => {
                    tableHeaders.push(emp.name);

                const tableRows = daysArray.map(d => {

                    employees.forEach(emp => {

                        rowData.push(label);

                    return rowData;
                });

                doc.autoTable({
                    head: [tableHeaders],
                    body: tableRows,
                    startY: 38,
                    theme: 'grid',
                    styles: {
                        fontSize: 8,
                        halign: 'center',
                        valign: 'middle',
                        cellPadding: 1.5
                    },
                    headStyles: {

                        textColor: [255, 255, 255],

                    alternateRowStyles: {
                        fillColor: [248, 250, 252]

                    columnStyles: {
                        0: { cellWidth: 10, fontStyle: 'bold' },
                        1: { cellWidth: 15 }

                    didParseCell: function (data) {
                        if (data.row.index !== undefined) {
                            const dayObj = daysArray[data.row.index];
                            if (dayObj) {
                                if (dayObj.dayOfWeek === 5) {
                                    if (data.column.index > 1) {

                                    if (data.column.index === 0 || data.column.index === 1) {
                                        data.cell.styles.textColor = [225, 29, 72];
                                    }
                                }
                            }
                        }
                    }
                });

                const finalY = doc.lastAutoTable.finalY + 10;
                doc.setFontSize(8);
                doc.setFont("Inter", "bold");
                doc.text("Keterangan Shift Kerja:", 15, finalY);
                doc.setFont("Inter", "normal");
                doc.text("P: Pagi (06:00 - 18:00) | M: Malam (18:00 - 06:00) | L: Libur (OFF)", 15, finalY + 4);
                doc.text("P (12.00): Shift Pagi Pendek khusus Jumat (06:00 - 12:00)", 15, finalY + 8);
                doc.text("P (18.00): Shift Pagi Penuh khusus Jumat (06:00 - 18:00)", 15, finalY + 12);

                doc.save(`Jadwal_Security_${getMonthName(selectedMonth)}_${selectedYear}.pdf`);
                showSuccessNotification('Sukses mengekspor jadwal PDF Vertikal!');
            };

            const triggerPrint = () => {
                window.print();

            return (
                <div className="flex flex-col min-h-screen">

                                    <div>

                                        <p className="text-xs text-slate-500">Sistem Shift 12 Jam (Pagi & Malam)</p>
                                    </div>
                                </div>
                                <div className="flex items-center space-x-3">
                                    <div className="flex items-center space-x-2">
                                        <div className="hidden sm:flex items-center space-x-1.5 text-xs font-medium text-emerald-600 bg-emerald-50 py-1 px-2.5 rounded-lg">
                                            <Icon name="Users" className="w-3.5 h-3.5" />
                                            <span>Shared</span>
                                        </div>
                                        {authLoading ? (

                                        ) : user ? (

                                                <img
                                                    src={user.photoURL}
                                                    alt=""
                                                    className="w-7 h-7 rounded-full ring-2 ring-brand-200"
                                                    referrerPolicy="no-referrer"
                                                />
                                                <div className="hidden sm:block text-xs">
                                                    <p className="font-medium text-slate-700 leading-tight">{user.displayName}</p>
                                                    <button onClick={handleLogout} className="text-red-500 hover:text-red-700 text-xs">Logout</button>
                                                </div>
                                            </div>
                                        ) : (
                                            <button

                                                className="flex items-center space-x-1.5 text-xs font-medium text-slate-600 hover:text-brand-600 bg-slate-100 hover:bg-brand-50 py-1.5 px-3 rounded-lg transition-colors"
                                            >
                                                <Icon name="LogIn" className="w-4 h-4" />
                                                <span className="hidden sm:inline">Login</span>
                                            </button>
                                        )}
                                    </div>
                                    <div className="flex items-center space-x-2 text-sm text-slate-500 bg-slate-100 py-1.5 px-3 rounded-lg font-medium">
                                        <Icon name="Clock" className="w-4 h-4 text-brand-600" />

                                    </div>

                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 print:p-0">
                        
                        {/* Toasts / Notifikasi */}

                        {/* Ringkasan Dashboard (Widget Informasi Utama) */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8 print:hidden">
                            <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-4">

                            <div className={`p-5 rounded-2xl border shadow-sm flex items-center space-x-4 ${securityCoverage.shortageDaysCount > 0 || securityCoverage.offRuns2.length > 0 ? 'bg-amber-50/50 border-amber-100' : 'bg-emerald-50/50 border-emerald-100'}`}>

                                className={`flex items-center space-x-2 py-3 px-5 border-b-2 font-medium text-sm transition-all whitespace-nowrap ${activeTab === 'rules' ? 'border-brand-600 text-brand-600 bg-brand-50/50 rounded-t-lg' : 'border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300'}`}
