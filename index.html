                                                >
                                                    {(() => {
                                                        const years = new Set();
                                                        const nowY = new Date().getFullYear();
                                                        years.add(nowY);
                                                        years.add(nowY + 1);
                                                        Object.keys(allSchedules).forEach(k => {
                                                            if (/^\d{4}_\d{1,2}$/.test(k)) {
                                                                const yy = Number(k.split('_')[0]);
                                                                if (!Number.isNaN(yy)) years.add(yy);
                                                            }
                                                        });
                                                        return [...years].sort((a, b) => a - b).map(y => (
                                                            <option key={y} value={y}>{y}</option>
                                                        ));
                                                    })()}
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                        {employees.map((emp, idx) => {
                                            const { stats, totalHours, totalWorkDays } = getEmployeeStats(emp.id);
                                            const colors = [
                                                { bg: 'bg-emerald-500', text: 'text-emerald-600', light: 'bg-emerald-50', border: 'border-emerald-200', badge: 'bg-emerald-100 text-emerald-700' },
                                                { bg: 'bg-blue-500', text: 'text-blue-600', light: 'bg-blue-50', border: 'border-blue-200', badge: 'bg-blue-100 text-blue-700' },
                                                { bg: 'bg-violet-500', text: 'text-violet-600', light: 'bg-violet-50', border: 'border-violet-200', badge: 'bg-violet-100 text-violet-700' },
                                                { bg: 'bg-amber-500', text: 'text-amber-600', light: 'bg-amber-50', border: 'border-amber-200', badge: 'bg-amber-100 text-amber-700' },
                                                { bg: 'bg-rose-500', text: 'text-rose-600', light: 'bg-rose-50', border: 'border-rose-200', badge: 'bg-rose-100 text-rose-700' },
                                                { bg: 'bg-cyan-500', text: 'text-cyan-600', light: 'bg-cyan-50', border: 'border-cyan-200', badge: 'bg-cyan-100 text-cyan-700' },
                                                { bg: 'bg-orange-500', text: 'text-orange-600', light: 'bg-orange-50', border: 'border-orange-200', badge: 'bg-orange-100 text-orange-700' },
                                                { bg: 'bg-pink-500', text: 'text-pink-600', light: 'bg-pink-50', border: 'border-pink-200', badge: 'bg-pink-100 text-pink-700' },
                                                { bg: 'bg-teal-500', text: 'text-teal-600', light: 'bg-teal-50', border: 'border-teal-200', badge: 'bg-teal-100 text-teal-700' },
                                                { bg: 'bg-indigo-500', text: 'text-indigo-600', light: 'bg-indigo-50', border: 'border-indigo-200', badge: 'bg-indigo-100 text-indigo-700' },
                                            ];
                                            const c = colors[idx % colors.length];
                                            const initial = emp.name.charAt(0).toUpperCase();
                                            return (
                                                <div key={emp.id} className={`border-l-4 ${c.border} border border-slate-100 p-4 rounded-xl ${c.light} transition-all hover:shadow-md`}>
                                                    <div className="flex justify-between items-center mb-3">
                                                        <div className="flex items-center space-x-3">
                                                            <div className={`w-9 h-9 ${c.bg} rounded-xl flex items-center justify-center text-white font-bold text-sm shadow-sm`}>
                                                                {initial}
                                                            </div>
                                                            <div>
                                                                <h4 className="font-bold text-slate-900 text-sm">{emp.name}</h4>
                                                                <span className={`text-[10px] ${c.badge} px-2 py-0.5 rounded-full font-bold`}>{emp.role}</span>
                                                            </div>
                                                        </div>
                                                        <div className="text-right">
                                                            <span className={`text-sm font-extrabold ${c.text}`}>{totalHours} Jam Kerja</span>
                                                            <p className="text-[10px] text-slate-400">{totalWorkDays} Hari Masuk</p>
                                                        </div>
                                                    </div>

                                                    <div className="grid grid-cols-4 gap-2 text-center">
                                                        <div className={`bg-white p-2 rounded border ${c.border}`}>
                                                            <span className="text-[10px] text-slate-400 block">Pagi (P)</span>
                                                            <span className={`text-xs font-bold ${c.text}`}>{stats.S1 + stats.S1_FRI_FULL}x</span>
                                                        </div>
                                                        <div className={`bg-white p-2 rounded border ${c.border}`}>
                                                            <span className="text-[10px] text-slate-400 block">Malam (M)</span>
                                                            <span className={`text-xs font-bold ${c.text}`}>{stats.S2}x</span>
                                                        </div>
                                                        <div className={`bg-white p-2 rounded border ${c.border}`}>
                                                            <span className="text-[10px] text-slate-400 block">P 12.00</span>
                                                            <span className={`text-xs font-bold ${c.text}`}>{stats.S1_FRI_SHORT}x</span>
                                                        </div>
                                                        <div className={`bg-white p-2 rounded border ${c.border}`}>
                                                            <span className="text-[10px] text-slate-400 block">Libur (L)</span>
                                                            <span className={`text-xs font-bold ${c.text}`}>{stats.OFF}x</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Arsip & Riwayat Jadwal Bulan Sebelumnya */}
                                <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                                    <h3 className="font-bold text-lg text-slate-900 mb-2">Arsip & Riwayat Jadwal Bulanan</h3>
                                    <p className="text-sm text-slate-500 mb-6">Gunakan tombol di bawah ini untuk melihat kembali atau menghapus arsip bulan-bulan sebelumnya yang terekam.</p>

                                    <div className="divide-y divide-slate-100">
                                        {Object.keys(allSchedules).length === 0 ? (
                                            <div className="py-8 text-center text-slate-400">
                                                <Icon name="Folder" className="w-10 h-10 mx-auto mb-2 text-slate-300" />
                                                Belum ada arsip jadwal bulanan yang terekam.
                                            </div>
                                        ) : (
                                            Object.keys(allSchedules).map(key => {
                                                const [year, month] = key.split('_');
                                                const isCurrent = key === currentKey;

                                                return (
                                                    <div key={key} className="py-3 flex justify-between items-center hover:bg-slate-50 px-2 rounded-lg transition-all">
                                                        <div className="flex items-center space-x-3">
                                                            <div className="w-8 h-8 bg-brand-50 text-brand-600 rounded-lg flex items-center justify-center">
                                                                <Icon name="FileText" className="w-4 h-4" />
                                                            </div>
                                                            <div>
                                                                <h4 className="font-bold text-sm text-slate-900">
                                                                    Bulan {getMonthName(Number(month))} {year}
                                                                </h4>
                                                                <span className="text-[10px] text-slate-400">
                                                                    {isCurrent ? 'Sedang Dibuka' : 'Arsip Tersimpan'}
                                                                </span>
                                                            </div>
                                                        </div>

                                                        <div className="flex items-center space-x-2">
                                                            <button 
                                                                onClick={() => {
                                                                    setSelectedMonth(Number(month));
                                                                    setSelectedYear(Number(year));
                                                                    setActiveTab('schedule');
                                                                    showSuccessNotification(`Arsip ${getMonthName(Number(month))} berhasil dibuka.`);
                                                                }}
                                                                className="px-3 py-1 bg-slate-100 hover:bg-brand-50 text-slate-700 hover:text-brand-600 text-xs font-semibold rounded-lg transition-all"
                                                            >
                                                                Buka Jadwal
                                                            </button>
                                                            <button 
                                                                onClick={() => {
                                                                    if (window.confirm('Hapus arsip bulan ini?')) {
                                                                        setAllSchedules(prev => {
                                                                            const copy = { ...prev };
                                                                            delete copy[key];
                                                                            return copy;
                                                                        });
                                                                        showSuccessNotification('Arsip berhasil dibuang.');
                                                                    }
                                                                }}
                                                                className="p-1.5 hover:bg-rose-50 text-slate-400 hover:text-rose-600 rounded-lg transition-colors"
                                                            >
                                                                <Icon name="Trash2" className="w-4 h-4" />
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t border-slate-200 py-6 mt-12 print:hidden text-center text-xs text-slate-400">
                        <p>© 2026 ShiftPlan Ganesa Satria. Semua jatah data & sistem dijamin presisi dan adil.</p>
                    </footer>

                    {/* Modal Request & Ganti Shift Manual */}
                    {cellEditing && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl animate-in fade-in zoom-in-95 duration-150">
                                <div className="flex justify-between items-start mb-4">
                                    <div>
                                        <h3 className="font-bold text-lg text-slate-900">Jadwal & Request</h3>
                                        <p className="text-xs text-slate-500 mt-1">
                                            {employees.find(e => e.id === cellEditing.empId)?.name} • Tanggal {cellEditing.day} {getMonthName(selectedMonth)}
                                        </p>
                                    </div>
                                    <button 
                                        onClick={() => setCellEditing(null)}
                                        className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-slate-600 transition-colors"
                                    >
                                        <Icon name="X" className="w-5 h-5" />
                                    </button>
                                </div>

                                {/* Section Request */}
                                <div className="mb-5">
                                    <h4 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Request Karyawan</h4>
                                    <p className="text-xs text-slate-500 mb-2.5">Setel permintaan sebelum generate agar jadwal otomatis menyesuaikan.</p>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button
                                            onClick={() => handleSetRequest('OFF')}
                                            className={`p-2.5 rounded-xl border text-center transition-all text-xs font-bold ${
                                                currentRequests[cellEditing.empId]?.[cellEditing.day] === 'OFF'
                                                    ? 'bg-rose-100 text-rose-700 border-rose-300 ring-2 ring-rose-200'
                                                    : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-rose-50 hover:border-rose-200'
                                            }`}
                                        >
                                            Libur
                                        </button>
                                        <button
                                            onClick={() => handleSetRequest('S1')}
                                            className={`p-2.5 rounded-xl border text-center transition-all text-xs font-bold ${
                                                currentRequests[cellEditing.empId]?.[cellEditing.day] === 'S1'
                                                    ? 'bg-emerald-100 text-emerald-700 border-emerald-300 ring-2 ring-emerald-200'
                                                    : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-emerald-50 hover:border-emerald-200'
                                            }`}
                                        >
                                            Masuk Pagi
                                        </button>
                                        <button
                                            onClick={() => handleSetRequest('S2')}
                                            className={`p-2.5 rounded-xl border text-center transition-all text-xs font-bold ${
                                                currentRequests[cellEditing.empId]?.[cellEditing.day] === 'S2'
                                                    ? 'bg-indigo-100 text-indigo-700 border-indigo-300 ring-2 ring-indigo-200'
                                                    : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-indigo-50 hover:border-indigo-200'
                                            }`}
                                        >
                                            Masuk Malam
                                        </button>
                                        <button
                                            onClick={() => handleSetRequest(null)}
                                            className="p-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-500 hover:bg-slate-100 hover:text-slate-700 text-center transition-all text-xs font-bold"
                                        >
                                            Hapus
                                        </button>
                                    </div>
                                    {currentRequests[cellEditing.empId]?.[cellEditing.day] && (
                                        <p className="text-xs text-emerald-600 mt-2 flex items-center gap-1">
                                            <Icon name="CheckCircle2" className="w-3.5 h-3.5" />
                                            Request tersimpan (akan diprioritaskan saat generate)
                                        </p>
                                    )}
                                </div>

                                <hr className="border-slate-100 mb-4" />

                                {/* Section Manual Shift */}
                                <h4 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Ubah Jadwal Manual</h4>
                                <p className="text-xs text-slate-500 mb-2.5">Terapkan langsung setelah generate jika ada penyesuaian.</p>
                                <div className="space-y-2">
                                    {Object.values(SHIFTS).map(s => (
                                        <button
                                            key={s.id}
                                            onClick={() => selectManualShift(s.id)}
                                            className={`w-full p-3 rounded-xl border text-left flex justify-between items-center transition-all text-sm ${s.color}`}
                                        >
                                            <span className="font-bold">Shift {s.name} ({s.label})</span>
                                            <span className="text-xs opacity-75">{s.start} - {s.end}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Konfirmasi Hapus Karyawan */}
                    {employeeToDelete && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl animate-in fade-in scale-in duration-150">
                                <div className="flex items-start space-x-3 text-rose-600 mb-4">
                                    <div className="p-2 bg-rose-50 rounded-lg">
                                        <Icon name="AlertTriangle" className="w-6 h-6" />
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-lg text-slate-900">Hapus Karyawan?</h3>
                                        <p className="text-sm text-slate-500 mt-1">
                                            Apakah Anda yakin ingin menghapus <strong>{employeeToDelete.name}</strong>? Tindakan ini akan menghapus data jadwal yang bersangkutan secara permanen.
                                        </p>
                                    </div>
                                </div>
                                <div className="flex justify-end space-x-3">
                                    <button
                                        onClick={() => setEmployeeToDelete(null)}
                                        className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition-colors"
                                    >
                                        Batal
                                    </button>
                                    <button
                                        onClick={confirmDeleteEmployee}
                                        className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl text-sm shadow-lg shadow-rose-600/15 transition-colors"
                                    >
                                        Ya, Hapus
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Render React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
